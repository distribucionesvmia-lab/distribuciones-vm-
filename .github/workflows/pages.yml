name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/sweet-bohr-lergl3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='.claude' --exclude='.taste-skill' --exclude='_site' --exclude='_herramientas' --exclude='_version-3d' --exclude='_version-anterior' --exclude='_sin-usar' --exclude='*.md' --exclude='*.zip' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
